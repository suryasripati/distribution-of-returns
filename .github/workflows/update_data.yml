name: Update Stock Data Daily

on:
  schedule:
    - cron: '0 23 * * 1-5'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install yfinance pandas requests lxml html5lib

      - name: Fetch Prices & Update JSON
        run: |
          python - << 'EOF'
          import datetime
          import json
          import pandas as pd
          import yfinance as yf
          import time
          import requests

          HEADERS = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}

          def fetch_single_ticker(ticker):
              start_date = f"{datetime.date.today().year}-01-01"
              try:
                  t = yf.Ticker(ticker)
                  hist = t.history(start=start_date)
                  if not hist.empty and 'Close' in hist:
                      series = hist['Close'].dropna()
                      if len(series) > 0:
                          start_p = float(series.iloc[0])
                          curr_p = float(series.iloc[-1])
                          ytd = ((curr_p - start_p) / start_p) * 100
                          clean_name = ticker.replace('.NS', '')
                          return {"ticker": clean_name, "ytd": round(ytd, 2)}
              except Exception:
                  pass
              return None

          def fetch_robust_list(ticker_list, batch_size=15):
              results = {}
              start_date = f"{datetime.date.today().year}-01-01"
              
              for i in range(0, len(ticker_list), batch_size):
                  batch = ticker_list[i:i + batch_size]
                  try:
                      df = yf.download(batch, start=start_date, progress=False)
                      closes = df['Close'] if 'Close' in df else df
                      
                      for t in batch:
                          try:
                              if len(batch) == 1:
                                  series = closes.dropna()
                              else:
                                  series = closes[t].dropna()
                                  
                              if len(series) > 0:
                                  start_p = float(series.iloc[0])
                                  curr_p = float(series.iloc[-1])
                                  ytd = ((curr_p - start_p) / start_p) * 100
                                  clean_name = t.replace('.NS', '')
                                  results[t] = {"ticker": clean_name, "ytd": round(ytd, 2)}
                          except Exception:
                              pass
                  except Exception:
                      pass
                  time.sleep(0.1)

              # Retry loop for any dropped tickers during batch download
              for t in ticker_list:
                  if t not in results:
                      res = fetch_single_ticker(t)
                      if res:
                          results[t] = res
                      time.sleep(0.05)

              return list(results.values())

          def get_nasdaq100():
              try:
                  url = 'https://en.wikipedia.org/wiki/NASDAQ-100'
                  r = requests.get(url, headers=HEADERS)
                  tables = pd.read_html(r.text)
                  for t in tables:
                      if 'Ticker' in t.columns or 'Symbol' in t.columns:
                          col = 'Ticker' if 'Ticker' in t.columns else 'Symbol'
                          syms = [str(x).replace('.', '-') for x in t[col].dropna().tolist()]
                          if len(syms) >= 95: return syms
              except Exception:
                  pass
              return []

          def get_sp500():
              try:
                  url = 'https://en.wikipedia.org/wiki/List_of_S%26P_500_companies'
                  r = requests.get(url, headers=HEADERS)
                  tables = pd.read_html(r.text)
                  return [str(t).replace('.', '-') for t in tables[0]['Symbol'].tolist()]
              except Exception:
                  pass
              return []

          # Complete NSE Indices Lists
          NIFTY_50 = ["ADANIENT","ADANIPORTS","APOLLOHOSP","ASIANPAINT","AXISBANK","BAJAJ-AUTO","BAJFINANCE","BAJAJFINSV","BEL","BPCL","BHARTIARTL","BRITANNIA","CIPLA","COALINDIA","DIVISLAB","DRREDDY","EICHERMOT","GRASIM","HCLTECH","HDFCBANK","HDFCLIFE","HEROMOTOCO","HINDALCO","HINDUNILVR","ICICIBANK","ITC","INDUSINDBK","INFY","JSWSTEEL","KOTAKBANK","LT","LTIM","MM","MARUTI","NTPC","NESTLEIND","ONGC","POWERGRID","RELIANCE","SBILIFE","SHRIRAMFIN","SBIN","SUNPHARMA","TCS","TATACONSUM","TATAMOTORS","TATASTEEL","TECHM","TITAN","ULTRACEMCO","WIPRO"]

          NIFTY_NEXT50 = ["ABB","AMBUJACEM","BANKBARODA","BERGEPAINT","BHARATFORG","BOSCHLTD","CANBK","CGPOWER","CHOLAFIN","COLPAL","DLF","DMART","GAIL","GODREJPROP","HAL","HAVELLS","ICICIGI","ICICIPRULI","IOC","IRCTC","IRFC","JINDALSTEL","JIOFIN","JSWENERGY","LICOFI","LODHA","MAXHEALTH","MOTHERSON","NAUKRI","NHPC","OIL","PAYTM","PFC","PNB","POLICYBZR","POONAWALLA","REC","RVNL","SIEMENS","SRF","SUPREMEIND","TATAPOWER","TRENT","TORNTPHARM","TVSMOTOR","UNITDSPR","VBL","VEDL","ZOMATO","ZYDUSLIFE"]

          NIFTY_IT = ["TCS","INFY","HCLTECH","WIPRO","TECHM","LTIM","PERSISTENT","COFORGE","MPHASIS","LTTS"]

          NIFTY_BANK = ["HDFCBANK","ICICIBANK","SBIN","KOTAKBANK","AXISBANK","BANKBARODA","PNB","CANBK","FEDERALBNK","IDFCFIRSTB","AUBANK","INDUSINDBK"]

          NIFTY_FINSRV = ["AXISBANK","BAJAJ-AUTO","BAJFINANCE","BAJAJFINSV","CHOLAFIN","HDFCBANK","HDFCLIFE","ICICIBANK","ICICIGI","ICICIPRULI","IDFCFIRSTB","JIOFIN","KOTAKBANK","LICHSGFIN","LICOFI","MUTHOOTFIN","PFC","REC","SBICARD","SBILIFE","SBIN","SHRIRAMFIN"]

          NIFTY_MIDCAP100 = ["ABCAPITAL","ABFRL","ACC","AARTIIND","ALKEM","AMBUJACEM","APLLTD","ASTRAL","AUROPHARMA","AUBANK","BALKRISIND","BANDHANBNK","BANKBARODA","BATAINDIA","BEL","BHARATFORG","BHEL","BIOCON","BOSCHLTD","BSOFT","CANBK","CANFINHOME","CGPOWER","CHAMBLFERT","CHOLAFIN","COFORGE","COLPAL","CONCOR","COROMANDEL","CROMPTON","CUMMINSIND","DALBHARAT","DEEPAKNTR","DELHIVERY","DIXON","DLF","ESCORTS","EXIDEIND","FEDERALBNK","GAIL","GLAXO","GLENMARK","GODREJPROP","GUJGASLTD","HAL","HAVELLS","HDFCAMC","HINDPETRO","HONAUT","IDFCFIRSTB","INDIAMART","INDHOTEL","IOC","IPCALAB","IRCTC","JINDALSTEL","JUBLFOOD","KALYANKJIL","KEI","KPITTECH","L&TFH","LAURUSLABS","LICHSGFIN","LUPIN","MAXHEALTH","MFSL","MGL","MOTHERSON","MPHASIS","MRF","MUTHOOTFIN","NATIONALUM","NAVINFLUOR","NHPC","NMDC","OBEROIRLTY","OFSS","OIL","PAYTM","PERSISTENT","PETRONET","PFC","POLYCAB","POONAWALLA","RBLBANK","REC","RVNL","SAIL","SIEMENS","SRF","SUPREMEIND","SUZLON","TATACOMM","TATAELXSI","TATAPOWER","TIINDIA","TORNTPHARM","TVSMOTOR","UNIONBANK","UPL","VOLTAS","YESBANK","ZYDUSLIFE"]

          NIFTY_500 = list(set(NIFTY_50 + NIFTY_NEXT50 + NIFTY_MIDCAP100))

          BENCHMARK_TICKERS = {
              "NASDAQ100": "^NDX",
              "SP500": "^GSPC",
              "NIFTY50": "^NSEI",
              "NIFTYNEXT50": "^NSMIDCP",
              "NIFTYIT": "^CNXIT",
              "NIFTYBANK": "^NSEBANK",
              "NIFTYFINSRV": "NIFTY_FIN_SERVICE.NS",
              "NIFTYMIDCAP100": "^NSEMDCP100",
              "NIFTY500": "^CRSLDX"
          }

          indices_config = {
              "NASDAQ100": get_nasdaq100(),
              "SP500": get_sp500(),
              "NIFTY50": [f"{t}.NS" for t in NIFTY_50],
              "NIFTYNEXT50": [f"{t}.NS" for t in NIFTY_NEXT50],
              "NIFTYIT": [f"{t}.NS" for t in NIFTY_IT],
              "NIFTYBANK": [f"{t}.NS" for t in NIFTY_BANK],
              "NIFTYFINSRV": [f"{t}.NS" for t in NIFTY_FINSRV],
              "NIFTYMIDCAP100": [f"{t}.NS" for t in NIFTY_MIDCAP100],
              "NIFTY500": [f"{t}.NS" for t in NIFTY_500]
          }

          index_returns = {}
          print("Fetching Benchmark Index returns...")
          for idx_name, b_symbol in BENCHMARK_TICKERS.items():
              res = fetch_single_ticker(b_symbol)
              if res:
                  index_returns[idx_name] = res['ytd']

          output = {
              "lastUpdated": datetime.date.today().strftime("%b %d, %Y"),
              "indexReturns": index_returns
          }

          for name, tickers in indices_config.items():
              print(f"Fetching constituents for {name} ({len(tickers)} tickers)...")
              output[name] = fetch_robust_list(tickers)

          with open('data.json', 'w') as f:
              json.dump(output, f, indent=2)
          EOF

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@github.com"
          git add data.json
          git commit -m "Added actual benchmark index performance display [skip ci]" || exit 0
          git push
