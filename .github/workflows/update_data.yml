name: Update Stock Data Daily

on:
  schedule:
    - cron: '0 23 * * 1-5'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install yfinance pandas requests lxml html5lib

      - name: Fetch Prices & Update JSON
        run: |
          python - << 'EOF'
          import datetime
          import json
          import pandas as pd
          import yfinance as yf
          import time
          import requests

          HEADERS = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'}

          # --- HARDCODED BASE LISTS ---
          HARDCODED_NIFTY_50 = ["ADANIENT","ADANIPORTS","APOLLOHOSP","ASIANPAINT","AXISBANK","BAJAJ-AUTO","BAJFINANCE","BAJAJFINSV","BEL","BPCL","BHARTIARTL","BRITANNIA","CIPLA","COALINDIA","DIVISLAB","DRREDDY","EICHERMOT","GRASIM","HCLTECH","HDFCBANK","HDFCLIFE","HEROMOTOCO","HINDALCO","HINDUNILVR","ICICIBANK","ITC","INDUSINDBK","INFY","JSWSTEEL","KOTAKBANK","LT","LTIM","MM","MARUTI","NTPC","NESTLEIND","ONGC","POWERGRID","RELIANCE","SBILIFE","SHRIRAMFIN","SBIN","SUNPHARMA","TCS","TATACONSUM","TATAMOTORS","TATASTEEL","TECHM","TITAN","ULTRACEMCO","WIPRO"]

          HARDCODED_NIFTY_NEXT50 = ["ABB","AMBUJACEM","BANKBARODA","BERGEPAINT","BHARATFORG","BOSCHLTD","CANBK","CGPOWER","CHOLAFIN","COLPAL","DLF","DMART","GAIL","GODREJPROP","HAL","HAVELLS","ICICIGI","ICICIPRULI","IOC","IRCTC","IRFC","JINDALSTEL","JIOFIN","JSWENERGY","LICOFI","LODHA","MAXHEALTH","MOTHERSON","NAUKRI","NHPC","OIL","PAYTM","PFC","PNB","POLICYBZR","POONAWALLA","REC","RVNL","SIEMENS","SRF","SUPREMEIND","TATAPOWER","TRENT","TORNTPHARM","TVSMOTOR","UNITDSPR","VBL","VEDL","ZOMATO","ZYDUSLIFE"]

          HARDCODED_NIFTY_IT = ["TCS","INFY","HCLTECH","WIPRO","TECHM","LTIM","PERSISTENT","COFORGE","MPHASIS","OFSS"]

          HARDCODED_NIFTY_BANK = ["HDFCBANK","ICICIBANK","SBIN","KOTAKBANK","AXISBANK","BANKBARODA","PNB","CANBK","FEDERALBNK","IDFCFIRSTB","AUBANK","INDUSINDBK"]

          HARDCODED_NIFTY_FINSRV = ["AXISBANK","BAJFINANCE","BAJAJFINSV","CHOLAFIN","HDFCBANK","HDFCLIFE","ICICIBANK","ICICIGI","ICICIPRULI","IDFCFIRSTB","JIOFIN","KOTAKBANK","LICHSGFIN","LICOFI","MUTHOOTFIN","PFC","REC","SBICARD","SBILIFE","SBIN","SHRIRAMFIN"]

          HARDCODED_NIFTY_MIDCAP100 = ["ABCAPITAL","ABFRL","AARTIIND","ALKEM","APLLTD","ASTRAL","AUROPHARMA","AUBANK","BALKRISIND","BANDHANBNK","BATAINDIA","BHEL","BIOCON","BSOFT","CANFINHOME","CHAMBLFERT","CONCOR","COROMANDEL","CROMPTON","CUMMINSIND","DALBHARAT","DEEPAKNTR","DELHIVERY","DIXON","ESCORTS","EXIDEIND","FEDERALBNK","GLAXO","GLENMARK","GODREJPROP","GUJGASLTD","HDFCAMC","HINDPETRO","HONAUT","INDIAMART","INDHOTEL","IPCALAB","JUBLFOOD","KALYANKJIL","KEI","KPITTECH","LAURUSLABS","LICHSGFIN","LUPIN","MFSL","MGL","MRF","MUTHOOTFIN","NATIONALUM","NAVINFLUOR","NMDC","OBEROIRLTY","PETRONET","POLYCAB","RBLBANK","SAIL","SUZLON","TATACOMM","TATAELXSI","TIINDIA","UNIONBANK","UPL","VOLTAS","YESBANK","ZYDUSLIFE","AIAENG","ASTRAZEN","ATUL","AUTOMBDNM","BBNL","BCG","BEML","BLSTARLTD","CARBORUNIV","CASTROLIND","CEATLTD","CENTURYTEX","CERA","CESC","CHALET","CHEMCON","CITYUNIONB","CREDITACC","CYIENT","DCMSHRIRAM","DEEPAKFERT","DEVYANI","EIDPARRY","EQUITASBNK","ERIS","FORTIS","GESHIP","GLS","GODREJIND","HAPPSTMNDS"]

          HARDCODED_NASDAQ100 = ["AAPL","MSFT","AMZN","NVDA","GOOGL","GOOG","META","TSLA","AVGO","COST","ASML","PEP","TMUS","CSCO","ADBE","TXN","AMD","QCOM","NFLX","AMGN","INTU","INTC","CMCSA","HON","BKNG","AMAT","ISRG","VRTX","ADP","SBUX","MDLZ","REGN","GILD","ADI","PANW","MU","LRCX","PDD","KLAC","SNPS","CDNS","MELI","PYPL","CRWD","ORLY","CSX","MAR","WDAY","ROP","ABNB","NTES","ROST","CHTR","CTAS","MNST","AEP","DXCM","IDXX","MRVL","ODFL","KDP","PAYX","PCAR","FTNT","LULU","AZN","CPRT","ON","FAST","VRSK","EXC","XEL","CDW","BKR","BIIB","CSGP","GEHC","FANG","DLTR","ANSS","ROK","WBD","TTD","MDB","DDOG","TEAM","ALGN","ILMN","ZS","SGEN","WBA","EBAY","ZM","ENPH","JD","LCID"]

          def get_nasdaq100():
              try:
                  url = 'https://en.wikipedia.org/wiki/NASDAQ-100'
                  r = requests.get(url, headers=HEADERS, timeout=10)
                  tables = pd.read_html(r.text)
                  for t in tables:
                      if 'Ticker' in t.columns or 'Symbol' in t.columns:
                          col = 'Ticker' if 'Ticker' in t.columns else 'Symbol'
                          syms = [str(x).replace('.', '-') for x in t[col].dropna().tolist()]
                          if len(syms) >= 95:
                              return syms
              except Exception:
                  pass
              return HARDCODED_NASDAQ100

          def get_sp400():
              """Fetch constituents directly from iShares S&P MidCap ETF (IJH)."""
              try:
                  url = "https://www.ishares.com/us/products/239724/ishares-core-sp-midcap-etf/1467271812596.ajax?fileType=csv&fileName=IJH_holdings&dataType=fund"
                  df = pd.read_csv(url, skiprows=9)
                  if 'Ticker' in df.columns:
                      tickers = df['Ticker'].dropna().astype(str).str.strip().tolist()
                      tickers = [t.replace('.', '-') for t in tickers if len(t) <= 5 and t not in ['USD', '-']]
                      if len(tickers) >= 300:
                          return tickers
              except Exception as e:
                  print(f"iShares IJH fetch failed: {e}")

              try:
                  url = 'https://en.wikipedia.org/wiki/List_of_S%26P_400_companies'
                  r = requests.get(url, headers=HEADERS, timeout=10)
                  tables = pd.read_html(r.text)
                  for t in tables:
                      if 'Symbol' in t.columns or 'Ticker' in t.columns:
                          col = 'Symbol' if 'Symbol' in t.columns else 'Ticker'
                          return [str(x).replace('.', '-') for x in t[col].dropna().tolist()]
              except Exception:
                  pass

              return []

          def get_russell2000():
              """Fetch full ~2000 constituents directly from iShares Russell 2000 ETF (IWM)."""
              try:
                  url = "https://www.ishares.com/us/products/239710/ishares-russell-2000-etf/1467271812596.ajax?fileType=csv&fileName=IWM_holdings&dataType=fund"
                  df = pd.read_csv(url, skiprows=9)
                  if 'Ticker' in df.columns:
                      tickers = df['Ticker'].dropna().astype(str).str.strip().tolist()
                      # Filter valid tickers (ignore cash/currency rows)
                      tickers = [t.replace('.', '-') for t in tickers if t.isalnum() or '-' in t]
                      tickers = [t for t in tickers if len(t) <= 5 and t not in ['USD', 'XTSLA', '-']]
                      if len(tickers) > 1000:
                          return tickers
              except Exception as e:
                  print(f"iShares IWM fetch failed: {e}")

              # Secondary backup if iShares changes CSV layout
              try:
                  url = "https://raw.githubusercontent.com/rreichel3/US-Stock-Symbols/main/all/all.csv"
                  df = pd.read_csv(url)
                  cols = [c for c in df.columns if 'symbol' in c.lower() or 'ticker' in c.lower()]
                  if cols:
                      syms = [str(x).replace('.', '-') for x in df[cols[0]].dropna().tolist() if len(str(x)) <= 5]
                      if len(syms) > 500:
                          return syms[:1800]
              except Exception as e:
                  print(f"Secondary Russell fallback failed: {e}")

              return []

          def get_sp500_data():
              sp500_list = []
              gics_map = {
                  "SP500_IT": [],
                  "SP500_FIN": [],
                  "SP500_HEALTH": [],
                  "SP500_CONS_DISC": [],
                  "SP500_ENERGY": []
              }
              try:
                  url = 'https://en.wikipedia.org/wiki/List_of_S%26P_500_companies'
                  r = requests.get(url, headers=HEADERS, timeout=10)
                  tables = pd.read_html(r.text)
                  df = tables[0]
                  
                  symbol_col = 'Symbol' if 'Symbol' in df.columns else df.columns[0]
                  sector_col = 'GICS Sector' if 'GICS Sector' in df.columns else df.columns[3]
                  
                  for _, row in df.iterrows():
                      sym = str(row[symbol_col]).replace('.', '-')
                      sec = str(row[sector_col]).strip()
                      sp500_list.append(sym)
                      
                      if sec == 'Information Technology':
                          gics_map["SP500_IT"].append(sym)
                      elif sec == 'Financials':
                          gics_map["SP500_FIN"].append(sym)
                      elif sec == 'Health Care':
                          gics_map["SP500_HEALTH"].append(sym)
                      elif sec == 'Consumer Discretionary':
                          gics_map["SP500_CONS_DISC"].append(sym)
                      elif sec == 'Energy':
                          gics_map["SP500_ENERGY"].append(sym)
              except Exception as e:
                  print(f"Error scraping S&P 500 GICS sectors: {e}")
              return sp500_list, gics_map

          def fetch_robust_list(ticker_list, batch_size=50):
              results = {}
              start_date = f"{datetime.date.today().year}-01-01"
              
              for i in range(0, len(ticker_list), batch_size):
                  batch = ticker_list[i:i + batch_size]
                  try:
                      df = yf.download(batch, start=start_date, progress=False)
                      closes = df['Close'] if 'Close' in df else df
                      
                      for t in batch:
                          try:
                              series = closes[t].dropna() if len(batch) > 1 else closes.dropna()
                              if len(series) > 1:
                                  start_p = float(series.iloc[0])
                                  curr_p = float(series.iloc[-1])
                                  if start_p > 0:
                                      ytd = ((curr_p - start_p) / start_p) * 100
                                      clean_name = t.replace('.NS', '')
                                      results[t] = {"ticker": clean_name, "ytd": round(ytd, 2)}
                          except Exception:
                              pass
                  except Exception:
                      pass
                  time.sleep(0.05)

              out = []
              for t in ticker_list:
                  if t in results:
                      out.append(results[t])

              return out

          sp500_all, gics_sectors = get_sp500_data()

          indices_config = {
              "NASDAQ100": get_nasdaq100(),
              "SP500": sp500_all,
              "RUSSELL2000": get_russell2000(),
              "SP400": get_sp400(),
              "SP500_IT": gics_sectors["SP500_IT"],
              "SP500_FIN": gics_sectors["SP500_FIN"],
              "SP500_HEALTH": gics_sectors["SP500_HEALTH"],
              "SP500_CONS_DISC": gics_sectors["SP500_CONS_DISC"],
              "SP500_ENERGY": gics_sectors["SP500_ENERGY"],
              "NIFTY50": [f"{t}.NS" for t in HARDCODED_NIFTY_50],
              "NIFTYNEXT50": [f"{t}.NS" for t in HARDCODED_NIFTY_NEXT50],
              "NIFTYIT": [f"{t}.NS" for t in HARDCODED_NIFTY_IT],
              "NIFTYBANK": [f"{t}.NS" for t in HARDCODED_NIFTY_BANK],
              "NIFTYFINSRV": [f"{t}.NS" for t in HARDCODED_NIFTY_FINSRV],
              "NIFTYMIDCAP100": [f"{t}.NS" for t in HARDCODED_NIFTY_MIDCAP100]
          }

          BENCHMARK_TICKERS = {
              "NASDAQ100": "^NDX",
              "SP500": "^GSPC",
              "RUSSELL2000": "^RUT",
              "SP400": "^MID",
              "SP500_IT": "XLK",
              "SP500_FIN": "XLF",
              "SP500_HEALTH": "XLV",
              "SP500_CONS_DISC": "XLY",
              "SP500_ENERGY": "XLE",
              "NIFTY50": "^NSEI",
              "NIFTYNEXT50": "^NSMIDCP",
              "NIFTYIT": "^CNXIT",
              "NIFTYBANK": "^NSEBANK",
              "NIFTYMIDCAP100": "^NSEMDCP100"
          }

          output = {
              "lastUpdated": datetime.date.today().strftime("%b %d, %Y"),
              "indexReturns": {}
          }

          parsed_data = {}
          for name, tickers in indices_config.items():
              print(f"Fetching constituents for {name} ({len(tickers)} tickers)...")
              parsed_data[name] = fetch_robust_list(tickers)
              output[name] = parsed_data[name]

          for idx_name in indices_config.keys():
              if idx_name in BENCHMARK_TICKERS:
                  try:
                      t = yf.Ticker(BENCHMARK_TICKERS[idx_name])
                      hist = t.history(start=f"{datetime.date.today().year}-01-01")
                      if not hist.empty and 'Close' in hist:
                          s = hist['Close'].dropna()
                          if len(s) > 0:
                              ytd = round(((float(s.iloc[-1]) - float(s.iloc[0])) / float(s.iloc[0])) * 100, 2)
                              output["indexReturns"][idx_name] = ytd
                              continue
                  except Exception:
                      pass

              constituents = parsed_data.get(idx_name, [])
              valid_ytds = [item['ytd'] for item in constituents if item.get('ytd') is not None]
              output["indexReturns"][idx_name] = round(sum(valid_ytds) / len(valid_ytds), 2) if valid_ytds else 0.0

          with open('data.json', 'w') as f:
              json.dump(output, f, indent=2)
          EOF

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@github.com"
          git add data.json
          git commit -m "Fix Russell 2000 holding list source [skip ci]" || exit 0
          git push
