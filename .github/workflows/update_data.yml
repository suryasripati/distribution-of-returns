name: Update Stock Data Daily

on:
  schedule:
    - cron: '0 23 * * 1-5'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install yfinance pandas requests lxml html5lib

      - name: Fetch Prices & Update JSON
        run: |
          python - << 'EOF'
          import datetime
          import json
          import pandas as pd
          import yfinance as yf
          import time
          import requests

          HEADERS = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}

          # --- HARDCODED FALLBACK LISTS ---
          HARDCODED_NIFTY_50 = ["ADANIENT","ADANIPORTS","APOLLOHOSP","ASIANPAINT","AXISBANK","BAJAJ-AUTO","BAJFINANCE","BAJAJFINSV","BEL","BPCL","BHARTIARTL","BRITANNIA","CIPLA","COALINDIA","DIVISLAB","DRREDDY","EICHERMOT","GRASIM","HCLTECH","HDFCBANK","HDFCLIFE","HEROMOTOCO","HINDALCO","HINDUNILVR","ICICIBANK","ITC","INDUSINDBK","INFY","JSWSTEEL","KOTAKBANK","LT","LTIM","MM","MARUTI","NTPC","NESTLEIND","ONGC","POWERGRID","RELIANCE","SBILIFE","SHRIRAMFIN","SBIN","SUNPHARMA","TCS","TATACONSUM","TATAMOTORS","TATASTEEL","TECHM","TITAN","ULTRACEMCO","WIPRO"]

          HARDCODED_NIFTY_NEXT50 = ["ABB","AMBUJACEM","BANKBARODA","BERGEPAINT","BHARATFORG","BOSCHLTD","CANBK","CGPOWER","CHOLAFIN","COLPAL","DLF","DMART","GAIL","GODREJPROP","HAL","HAVELLS","ICICIGI","ICICIPRULI","IOC","IRCTC","IRFC","JINDALSTEL","JIOFIN","JSWENERGY","LICOFI","LODHA","MAXHEALTH","MOTHERSON","NAUKRI","NHPC","OIL","PAYTM","PFC","PNB","POLICYBZR","POONAWALLA","REC","RVNL","SIEMENS","SRF","SUPREMEIND","TATAPOWER","TRENT","TORNTPHARM","TVSMOTOR","UNITDSPR","VBL","VEDL","ZOMATO","ZYDUSLIFE"]

          HARDCODED_NIFTY_IT = ["TCS","INFY","HCLTECH","WIPRO","TECHM","LTIM","PERSISTENT","COFORGE","MPHASIS","OFSS"]

          HARDCODED_NIFTY_BANK = ["HDFCBANK","ICICIBANK","SBIN","KOTAKBANK","AXISBANK","BANKBARODA","PNB","CANBK","FEDERALBNK","IDFCFIRSTB","AUBANK","INDUSINDBK"]

          HARDCODED_NIFTY_FINSRV = ["AXISBANK","BAJAJ-AUTO","BAJFINANCE","BAJAJFINSV","CHOLAFIN","HDFCBANK","HDFCLIFE","ICICIBANK","ICICIGI","ICICIPRULI","IDFCFIRSTB","JIOFIN","KOTAKBANK","LICHSGFIN","LICOFI","MUTHOOTFIN","PFC","REC","SBICARD","SBILIFE","SBIN","SHRIRAMFIN"]

          HARDCODED_NIFTY_MIDCAP100 = ["ABCAPITAL","ABFRL","ACC","AARTIIND","ALKEM","AMBUJACEM","APLLTD","ASTRAL","AUROPHARMA","AUBANK","BALKRISIND","BANDHANBNK","BANKBARODA","BATAINDIA","BEL","BHARATFORG","BHEL","BIOCON","BOSCHLTD","BSOFT","CANBK","CANFINHOME","CGPOWER","CHAMBLFERT","CHOLAFIN","COFORGE","COLPAL","CONCOR","COROMANDEL","CROMPTON","CUMMINSIND","DALBHARAT","DEEPAKNTR","DELHIVERY","DIXON","DLF","ESCORTS","EXIDEIND","FEDERALBNK","GAIL","GLAXO","GLENMARK","GODREJPROP","GUJGASLTD","HAL","HAVELLS","HDFCAMC","HINDPETRO","HONAUT","IDFCFIRSTB","INDIAMART","INDHOTEL","IOC","IPCALAB","IRCTC","JINDALSTEL","JUBLFOOD","KALYANKJIL","KEI","KPITTECH","L&TFH","LAURUSLABS","LICHSGFIN","LUPIN","MAXHEALTH","MFSL","MGL","MOTHERSON","MPHASIS","MRF","MUTHOOTFIN","NATIONALUM","NAVINFLUOR","NHPC","NMDC","OBEROIRLTY","OFSS","OIL","PAYTM","PERSISTENT","PETRONET","PFC","POLYCAB","POONAWALLA","RBLBANK","REC","RVNL","SAIL","SIEMENS","SRF","SUPREMEIND","SUZLON","TATACOMM","TATAELXSI","TATAPOWER","TIINDIA","TORNTPHARM","TVSMOTOR","UNIONBANK","UPL","VOLTAS","YESBANK","ZYDUSLIFE"]

          HARDCODED_NASDAQ100 = ["AAPL","MSFT","AMZN","NVDA","GOOGL","GOOG","META","TSLA","AVGO","COST","ASML","PEP","TMUS","CSCO","ADBE","TXN","AMD","QCOM","NFLX","AMGN","INTU","INTC","CMCSA","HON","BKNG","AMAT","ISRG","VRTX","ADP","SBUX","MDLZ","REGN","GILD","ADI","PANW","MU","LRCX","PDD","KLAC","SNPS","CDNS","MELI","PYPL","CRWD","ORLY","CSX","MAR","WDAY","ROP","ABNB","NTES","ROST","CHTR","CTAS","MNST","AEP","DXCM","IDXX","MRVL","ODFL","KDP","PAYX","PCAR","FTNT","LULU","AZN","CPRT","ON","FAST","VRSK","EXC","XEL","CDW","BKR","BIIB","CSGP","GEHC","FANG","DLTR","ANSS","ROK","WBD","TTD","MDB","DDOG","TEAM","ALGN","ILMN","ZS","SGEN","WBA","EBAY","ZM","ENPH","JD","LCID"]


          # --- DYNAMIC FETCH WITH HARDCODED FALLBACK FUNCTIONS ---

          def get_nasdaq100():
              """Dynamic Wikipedia scrape with hardcoded fallback"""
              try:
                  url = 'https://en.wikipedia.org/wiki/NASDAQ-100'
                  r = requests.get(url, headers=HEADERS, timeout=10)
                  tables = pd.read_html(r.text)
                  for t in tables:
                      if 'Ticker' in t.columns or 'Symbol' in t.columns:
                          col = 'Ticker' if 'Ticker' in t.columns else 'Symbol'
                          syms = [str(x).replace('.', '-') for x in t[col].dropna().tolist()]
                          if len(syms) >= 95:
                              print(f"[Dynamic] NASDAQ 100 loaded {len(syms)} tickers from Wikipedia.")
                              return syms
              except Exception as e:
                  print(f"[Fallback] NASDAQ 100 Wikipedia fetch failed ({e}). Using hardcoded list.")
              return HARDCODED_NASDAQ100

          def get_sp500():
              """Dynamic Wikipedia scrape"""
              try:
                  url = 'https://en.wikipedia.org/wiki/List_of_S%26P_500_companies'
                  r = requests.get(url, headers=HEADERS, timeout=10)
                  tables = pd.read_html(r.text)
                  syms = [str(t).replace('.', '-') for t in tables[0]['Symbol'].tolist()]
                  if len(syms) >= 490:
                      print(f"[Dynamic] S&P 500 loaded {len(syms)} tickers from Wikipedia.")
                      return syms
              except Exception as e:
                  print(f"[Fallback] S&P 500 fetch failed ({e}).")
              return []

          def get_nifty_dynamic(index_code, fallback_list):
              """
              Dynamic NSE constituent fetch using direct CSV archives.
              Falls back to hardcoded list if NSE blocks or changes the endpoint.
              Examples of index_code: 'nifty50', 'niftynext50', 'niftyit', 'niftybank', 'niftyfinancialservices', 'niftymidcap100'
              """
              urls = [
                  f"https://niftyindices.com/IndexConstituent/ind_{index_code}list.csv",
                  f"https://www1.nseindia.com/content/indices/ind_{index_code}list.csv"
              ]
              for url in urls:
                  try:
                      r = requests.get(url, headers=HEADERS, timeout=10)
                      if r.status_code == 200:
                          df = pd.read_csv(pd.compat.StringIO(r.text) if hasattr(pd, 'compat') else pd.io.common.StringIO(r.text))
                          if 'Symbol' in df.columns:
                              symbols = [f"{sym.strip()}.NS" for sym in df['Symbol'].dropna().tolist()]
                              if len(symbols) > 0:
                                  print(f"[Dynamic] Loaded {len(symbols)} tickers for {index_code} dynamically.")
                                  return symbols
                  except Exception:
                      pass
              
              print(f"[Fallback] {index_code} dynamic fetch failed/blocked. Using hardcoded array.")
              return [f"{t}.NS" for t in fallback_list]


          # --- DATA FETCHING HELPERS ---

          def fetch_single_ticker(ticker):
              start_date = f"{datetime.date.today().year}-01-01"
              try:
                  t = yf.Ticker(ticker)
                  hist = t.history(start=start_date)
                  if not hist.empty and 'Close' in hist:
                      series = hist['Close'].dropna()
                      if len(series) > 0:
                          start_p = float(series.iloc[0])
                          curr_p = float(series.iloc[-1])
                          ytd = ((curr_p - start_p) / start_p) * 100
                          clean_name = ticker.replace('.NS', '')
                          return {"ticker": clean_name, "ytd": round(ytd, 2)}
              except Exception:
                  pass
              return None

          def fetch_robust_list(ticker_list, batch_size=20):
              results = {}
              start_date = f"{datetime.date.today().year}-01-01"
              
              for i in range(0, len(ticker_list), batch_size):
                  batch = ticker_list[i:i + batch_size]
                  try:
                      df = yf.download(batch, start=start_date, progress=False)
                      closes = df['Close'] if 'Close' in df else df
                      
                      for t in batch:
                          try:
                              if len(batch) == 1:
                                  series = closes.dropna()
                              else:
                                  series = closes[t].dropna()
                                  
                              if len(series) > 0:
                                  start_p = float(series.iloc[0])
                                  curr_p = float(series.iloc[-1])
                                  ytd = ((curr_p - start_p) / start_p) * 100
                                  clean_name = t.replace('.NS', '')
                                  results[t] = {"ticker": clean_name, "ytd": round(ytd, 2)}
                          except Exception:
                              pass
                  except Exception:
                      pass
                  time.sleep(0.2)

              for t in ticker_list:
                  if t not in results:
                      res = fetch_single_ticker(t)
                      if res:
                          results[t] = res
                      time.sleep(0.05)

              return list(results.values())


          # --- MAIN EXECUTION ---

          nifty50_tickers = get_nifty_dynamic('nifty50', HARDCODED_NIFTY_50)
          niftynext50_tickers = get_nifty_dynamic('niftynext50', HARDCODED_NIFTY_NEXT50)
          niftymidcap100_tickers = get_nifty_dynamic('niftymidcap100', HARDCODED_NIFTY_MIDCAP100)

          indices_config = {
              "NASDAQ100": get_nasdaq100(),
              "SP500": get_sp500(),
              "NIFTY50": nifty50_tickers,
              "NIFTYNEXT50": niftynext50_tickers,
              "NIFTYIT": get_nifty_dynamic('niftyit', HARDCODED_NIFTY_IT),
              "NIFTYBANK": get_nifty_dynamic('niftybank', HARDCODED_NIFTY_BANK),
              "NIFTYFINSRV": get_nifty_dynamic('niftyfinancialservices', HARDCODED_NIFTY_FINSRV),
              "NIFTYMIDCAP100": niftymidcap100_tickers,
              "NIFTY500": list(set(nifty50_tickers + niftynext50_tickers + niftymidcap100_tickers))
          }

          BENCHMARK_TICKERS = {
              "NASDAQ100": "^NDX",
              "SP500": "^GSPC",
              "NIFTY50": "^NSEI",
              "NIFTYNEXT50": "^NSMIDCP",
              "NIFTYIT": "^CNXIT",
              "NIFTYBANK": "^NSEBANK",
              "NIFTYFINSRV": "^CNXFIN",
              "NIFTYMIDCAP100": "^NSEMDCP100",
              "NIFTY500": "^CRSLDX"
          }

          index_returns = {}
          print("Fetching Benchmark Index returns...")
          for idx_name, b_symbol in BENCHMARK_TICKERS.items():
              res = fetch_single_ticker(b_symbol)
              if res:
                  index_returns[idx_name] = res['ytd']

          output = {
              "lastUpdated": datetime.date.today().strftime("%b %d, %Y"),
              "indexReturns": index_returns
          }

          for name, tickers in indices_config.items():
              print(f"Fetching constituents for {name} ({len(tickers)} tickers)...")
              output[name] = fetch_robust_list(tickers)

          with open('data.json', 'w') as f:
              json.dump(output, f, indent=2)
          EOF

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@github.com"
          git add data.json
          git commit -m "Update stock data with dynamic + fallback constituents [skip ci]" || exit 0
          git push
