name: Update Stock Data Daily

on:
  schedule:
    - cron: '0 23 * * 1-5'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install yfinance pandas requests lxml html5lib concurrent-log-handler

      - name: Fetch Prices & Update JSON
        run: |
          python - << 'EOF'
          import datetime
          import json
          import yfinance as yf
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from constituents import (
              NASDAQ100_TICKERS, SP500_TICKERS, RUSSELL_2000_TICKERS,
              NIFTY_50_TICKERS, NIFTY_NEXT50_TICKERS, NSE_500_TICKERS,
              NIFTY_MIDCAP100_TICKERS, NIFTY_IT_TICKERS, NIFTY_BANK_TICKERS,
              NIFTY_FINSRV_TICKERS
          )

          indices_config = {
              "NASDAQ100": NASDAQ100_TICKERS,
              "SP500": SP500_TICKERS,
              "RUSSELL2000": RUSSELL_2000_TICKERS,
              "NIFTY50": NIFTY_50_TICKERS,
              "NIFTYNEXT50": NIFTY_NEXT50_TICKERS,
              "NIFTY500": NSE_500_TICKERS,
              "NIFTYMIDCAP100": NIFTY_MIDCAP100_TICKERS,
              "NIFTYIT": NIFTY_IT_TICKERS,
              "NIFTYBANK": NIFTY_BANK_TICKERS,
              "NIFTYFINSRV": NIFTY_FINSRV_TICKERS
          }

          BENCHMARK_TICKERS = {
              "NASDAQ100": "^NDX", "SP500": "^GSPC", "RUSSELL2000": "^RUT",
              "NIFTY50": "^NSEI", "NIFTYNEXT50": "^NSMIDCP", "NIFTY500": "^CRSLDX",
              "NIFTYMIDCAP100": "^NSEMDCP100", "NIFTYIT": "^CNXIT",
              "NIFTYBANK": "^NSEBANK", "NIFTYFINSRV": "NIFTY_FIN_SERVICE.NS"
          }

          def download_chunk(batch):
              chunk_results = {}
              start_date = f"{datetime.date.today().year}-01-01"
              try:
                  df = yf.download(batch, start=start_date, progress=False, threads=False)
                  closes = df['Close'] if 'Close' in df else df
                  for t in batch:
                      try:
                          series = closes[t].dropna() if len(batch) > 1 else closes.dropna()
                          if len(series) > 1:
                              start_p = float(series.iloc[0])
                              curr_p = float(series.iloc[-1])
                              if start_p > 0:
                                  ytd = ((curr_p - start_p) / start_p) * 100
                                  clean_name = t.replace('.NS', '')
                                  chunk_results[t] = {"ticker": clean_name, "ytd": round(ytd, 2)}
                      except Exception:
                          pass
              except Exception:
                  pass
              return chunk_results

          def fetch_robust_list(ticker_list, batch_size=20):
              ticker_list = list(dict.fromkeys(ticker_list))
              results = {}
              chunks = [ticker_list[i:i + batch_size] for i in range(0, len(ticker_list), batch_size)]
              
              with ThreadPoolExecutor(max_workers=4) as executor:
                  future_to_chunk = {executor.submit(download_chunk, chunk): chunk for chunk in chunks}
                  for future in as_completed(future_to_chunk):
                      res = future.result()
                      results.update(res)

              out = []
              for t in ticker_list:
                  if t in results:
                      out.append(results[t])
              return out

          output = {
              "lastUpdated": datetime.date.today().strftime("%b %d, %Y"),
              "indexReturns": {}
          }

          parsed_data = {}
          for name, tickers in indices_config.items():
              print(f"Fetching {name} ({len(tickers)} tickers)...")
              parsed_data[name] = fetch_robust_list(tickers)
              output[name] = parsed_data[name]

          for idx_name in indices_config.keys():
              benchmark_fetched = False
              if idx_name in BENCHMARK_TICKERS:
                  try:
                      t = yf.Ticker(BENCHMARK_TICKERS[idx_name])
                      hist = t.history(start=f"{datetime.date.today().year}-01-01")
                      if not hist.empty and 'Close' in hist:
                          s = hist['Close'].dropna()
                          if len(s) > 1:
                              ytd = round(((float(s.iloc[-1]) - float(s.iloc[0])) / float(s.iloc[0])) * 100, 2)
                              output["indexReturns"][idx_name] = ytd
                              benchmark_fetched = True
                  except Exception:
                      pass

              if not benchmark_fetched:
                  constituents = parsed_data.get(idx_name, [])
                  valid_ytds = [item['ytd'] for item in constituents if item.get('ytd') is not None]
                  output["indexReturns"][idx_name] = round(sum(valid_ytds) / len(valid_ytds), 2) if valid_ytds else 0.0

          with open('data.json', 'w') as f:
              json.dump(output, f, indent=2)
          EOF

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@github.com"
          git add data.json constituents.py
          git commit -m "Standardize index keys and update constituent data [skip ci]" || exit 0
          git push
