name: Update Stock Data Daily

on:
  schedule:
    - cron: '0 23 * * 1-5'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install yfinance pandas requests lxml html5lib

      - name: Fetch Prices & Update JSON
        run: |
          python - << 'EOF'
          import datetime
          import json
          import pandas as pd
          import yfinance as yf
          import time
          import requests
          import io

          HEADERS = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'}

          # --- HARDCODED LISTS ---
          HARDCODED_NIFTY_50 = ["ADANIENT","ADANIPORTS","APOLLOHOSP","ASIANPAINT","AXISBANK","BAJAJ-AUTO","BAJFINANCE","BAJAJFINSV","BEL","BPCL","BHARTIARTL","BRITANNIA","CIPLA","COALINDIA","DIVISLAB","DRREDDY","EICHERMOT","GRASIM","HCLTECH","HDFCBANK","HDFCLIFE","HEROMOTOCO","HINDALCO","HINDUNILVR","ICICIBANK","ITC","INDUSINDBK","INFY","JSWSTEEL","KOTAKBANK","LT","LTIM","MM","MARUTI","NTPC","NESTLEIND","ONGC","POWERGRID","RELIANCE","SBILIFE","SHRIRAMFIN","SBIN","SUNPHARMA","TCS","TATACONSUM","TATAMOTORS","TATASTEEL","TECHM","TITAN","ULTRACEMCO","WIPRO"]

          HARDCODED_NIFTY_NEXT50 = ["ABB","ACC","ADANIENSOL","ADANIGREEN","ADANIPOVR","AMBUJACEM","BANKBARODA","BERGEPAINT","BHARATFORG","BOSCHLTD","CANBK","CGPOWER","CHOLAFIN","COLPAL","DLF","DMART","GAIL","GODREJPROP","HAL","HAVELLS","ICICIGI","ICICIPRULI","IOC","IRCTC","IRFC","JINDALSTEL","JIOFIN","JSWENERGY","LICOFI","LODHA","MAXHEALTH","MOTHERSON","NAUKRI","NHPC","OIL","PAYTM","PFC","PNB","POLICYBZR","POONAWALLA","REC","RVNL","SIEMENS","SRF","SUPREMEIND","TATAPOWER","TRENT","TORNTPHARM","TVSMOTOR","UNITDSPR","VBL","VEDL","ZOMATO","ZYDUSLIFE"]

          HARDCODED_NIFTY_IT = ["TCS","INFY","HCLTECH","WIPRO","TECHM","LTIM","PERSISTENT","COFORGE","MPHASIS","OFSS"]

          HARDCODED_NIFTY_BANK = ["HDFCBANK","ICICIBANK","SBIN","KOTAKBANK","AXISBANK","BANKBARODA","PNB","CANBK","FEDERALBNK","IDFCFIRSTB","AUBANK","INDUSINDBK"]

          HARDCODED_NIFTY_FINSRV = ["AXISBANK","BAJFINANCE","BAJAJFINSV","CHOLAFIN","HDFCBANK","HDFCLIFE","ICICIBANK","ICICIGI","ICICIPRULI","IDFCFIRSTB","JIOFIN","KOTAKBANK","LICHSGFIN","LICOFI","MUTHOOTFIN","PFC","REC","SBICARD","SBILIFE","SBIN","SHRIRAMFIN"]

          HARDCODED_NIFTY_MIDCAP100 = ["ABCAPITAL","ABFRL","AARTIIND","ALKEM","APLLTD","ASTRAL","AUROPHARMA","AUBANK","BALKRISIND","BANDHANBNK","BATAINDIA","BHEL","BIOCON","BSOFT","CANFINHOME","CHAMBLFERT","CONCOR","COROMANDEL","CROMPTON","CUMMINSIND","DALBHARAT","DEEPAKNTR","DELHIVERY","DIXON","ESCORTS","EXIDEIND","FEDERALBNK","GLAXO","GLENMARK","GODREJPROP","GUJGASLTD","HDFCAMC","HINDPETRO","HONAUT","INDIAMART","INDHOTEL","IPCALAB","JUBLFOOD","KALYANKJIL","KEI","KPITTECH","LAURUSLABS","LICHSGFIN","LUPIN","MFSL","MGL","MRF","MUTHOOTFIN","NATIONALUM","NAVINFLUOR","NMDC","OBEROIRLTY","PETRONET","POLYCAB","RBLBANK","SAIL","SUZLON","TATACOMM","TATAELXSI","TIINDIA","UNIONBANK","UPL","VOLTAS","YESBANK","ZYDUSLIFE"]

          HARDCODED_NASDAQ100 = ["AAPL","MSFT","AMZN","NVDA","GOOGL","GOOG","META","TSLA","AVGO","COST","ASML","PEP","TMUS","CSCO","ADBE","TXN","AMD","QCOM","NFLX","AMGN","INTU","INTC","CMCSA","HON","BKNG","AMAT","ISRG","VRTX","ADP","SBUX","MDLZ","REGN","GILD","ADI","PANW","MU","LRCX","PDD","KLAC","SNPS","CDNS","MELI","PYPL","CRWD","ORLY","CSX","MAR","WDAY","ROP","ABNB","NTES","ROST","CHTR","CTAS","MNST","AEP","DXCM","IDXX","MRVL","ODFL","KDP","PAYX","PCAR","FTNT","LULU","AZN","CPRT","ON","FAST","VRSK","EXC","XEL","CDW","BKR","BIIB","CSGP","GEHC","FANG","DLTR","ANSS","ROK","WBD","TTD","MDB","DDOG","TEAM","ALGN","ILMN","ZS","SGEN","WBA","EBAY","ZM","ENPH","JD","LCID"]

          # --- DYNAMIC SCRAPERS ---

          def get_nasdaq100():
              try:
                  url = 'https://en.wikipedia.org/wiki/NASDAQ-100'
                  r = requests.get(url, headers=HEADERS, timeout=10)
                  tables = pd.read_html(r.text)
                  for t in tables:
                      if 'Ticker' in t.columns or 'Symbol' in t.columns:
                          col = 'Ticker' if 'Ticker' in t.columns else 'Symbol'
                          syms = [str(x).replace('.', '-') for x in t[col].dropna().tolist()]
                          if len(syms) >= 95:
                              return syms
              except Exception:
                  pass
              return HARDCODED_NASDAQ100

          def get_sp500():
              try:
                  url = 'https://en.wikipedia.org/wiki/List_of_S%26P_500_companies'
                  r = requests.get(url, headers=HEADERS, timeout=10)
                  tables = pd.read_html(r.text)
                  syms = [str(t).replace('.', '-') for t in tables[0]['Symbol'].tolist()]
                  if len(syms) >= 490:
                      return syms
              except Exception:
                  pass
              return []

          def get_nifty500():
              """Fetch full 500 constituents dynamically from Wikipedia or mirror CSVs"""
              sources = [
                  'https://en.wikipedia.org/wiki/NIFTY_500',
                  'https://raw.githubusercontent.com/anandheritage/Nifty500-Tickers/main/nifty500.csv'
              ]
              for src in sources:
                  try:
                      if 'wikipedia' in src:
                          r = requests.get(src, headers=HEADERS, timeout=10)
                          tables = pd.read_html(r.text)
                          for t in tables:
                              col = next((c for c in ['Symbol', 'Ticker', 'NSE Symbol'] if c in t.columns), None)
                              if col:
                                  syms = [f"{str(x).strip()}.NS" for x in t[col].dropna().tolist()]
                                  if len(syms) >= 450:
                                      print(f"[Dynamic] Loaded {len(syms)} tickers for NIFTY 500 from Wikipedia.")
                                      return syms
                      else:
                          df = pd.read_csv(src)
                          col = next((c for c in ['Symbol', 'Ticker'] if c in df.columns), None)
                          if col:
                              syms = [f"{str(x).strip()}.NS" for x in df[col].dropna().tolist()]
                              if len(syms) >= 450:
                                  print(f"[Dynamic] Loaded {len(syms)} tickers for NIFTY 500 from CSV source.")
                                  return syms
                  except Exception:
                      pass
              print("[Fallback] NIFTY 500 dynamic fetch failed. Using fallback list.")
              return []

          def fetch_single_ticker(ticker):
              start_date = f"{datetime.date.today().year}-01-01"
              try:
                  t = yf.Ticker(ticker)
                  hist = t.history(start=start_date)
                  if not hist.empty and 'Close' in hist:
                      series = hist['Close'].dropna()
                      if len(series) > 0:
                          start_p = float(series.iloc[0])
                          curr_p = float(series.iloc[-1])
                          ytd = ((curr_p - start_p) / start_p) * 100
                          clean_name = ticker.replace('.NS', '')
                          return {"ticker": clean_name, "ytd": round(ytd, 2)}
              except Exception:
                  pass
              return None

          def fetch_robust_list(ticker_list, batch_size=30):
              results = {}
              start_date = f"{datetime.date.today().year}-01-01"
              
              for i in range(0, len(ticker_list), batch_size):
                  batch = ticker_list[i:i + batch_size]
                  try:
                      df = yf.download(batch, start=start_date, progress=False)
                      closes = df['Close'] if 'Close' in df else df
                      
                      for t in batch:
                          try:
                              series = closes[t].dropna() if len(batch) > 1 else closes.dropna()
                              if len(series) > 0:
                                  start_p = float(series.iloc[0])
                                  curr_p = float(series.iloc[-1])
                                  ytd = ((curr_p - start_p) / start_p) * 100
                                  clean_name = t.replace('.NS', '')
                                  results[t] = {"ticker": clean_name, "ytd": round(ytd, 2)}
                          except Exception:
                              pass
                  except Exception:
                      pass
                  time.sleep(0.05)

              # Ensure every requested ticker gets represented even if download drops
              for t in ticker_list:
                  if t not in results:
                      res = fetch_single_ticker(t)
                      clean_name = t.replace('.NS', '')
                      if res:
                          results[t] = res
                      else:
                          results[t] = {"ticker": clean_name, "ytd": 0.0}

              return [results[t] for t in ticker_list if t in results]

          # --- EXECUTION ---

          nifty50_tickers = [f"{t}.NS" for t in HARDCODED_NIFTY_50]
          niftynext50_tickers = [f"{t}.NS" for t in HARDCODED_NIFTY_NEXT50]
          niftymidcap100_tickers = [f"{t}.NS" for t in HARDCODED_NIFTY_MIDCAP100]

          # Resolve NIFTY 500 constituents
          nifty500_dynamic = get_nifty500()
          if len(nifty500_dynamic) >= 450:
              nifty500_tickers = nifty500_dynamic
          else:
              nifty500_tickers = list(dict.fromkeys(nifty50_tickers + niftynext50_tickers + niftymidcap100_tickers))

          indices_config = {
              "NASDAQ100": get_nasdaq100(),
              "SP500": get_sp500(),
              "NIFTY50": nifty50_tickers,
              "NIFTYNEXT50": niftynext50_tickers,
              "NIFTYIT": [f"{t}.NS" for t in HARDCODED_NIFTY_IT],
              "NIFTYBANK": [f"{t}.NS" for t in HARDCODED_NIFTY_BANK],
              "NIFTYFINSRV": [f"{t}.NS" for t in HARDCODED_NIFTY_FINSRV],
              "NIFTYMIDCAP100": niftymidcap100_tickers,
              "NIFTY500": nifty500_tickers
          }

          BENCHMARK_TICKERS = {
              "NASDAQ100": "^NDX",
              "SP500": "^GSPC",
              "NIFTY50": "^NSEI",
              "NIFTYNEXT50": "^NSMIDCP",
              "NIFTYIT": "^CNXIT",
              "NIFTYBANK": "^NSEBANK",
              "NIFTYMIDCAP100": "^NSEMDCP100",
              "NIFTY500": "^CRSLDX"
          }

          output = {
              "lastUpdated": datetime.date.today().strftime("%b %d, %Y"),
              "indexReturns": {}
          }

          parsed_data = {}
          for name, tickers in indices_config.items():
              print(f"Fetching constituents for {name} ({len(tickers)} tickers)...")
              parsed_data[name] = fetch_robust_list(tickers)
              output[name] = parsed_data[name]

          # Benchmark Return Calculations
          for idx_name in indices_config.keys():
              if idx_name in BENCHMARK_TICKERS:
                  res = fetch_single_ticker(BENCHMARK_TICKERS[idx_name])
                  if res and res.get('ytd') is not None:
                      output["indexReturns"][idx_name] = res['ytd']
                      continue
              
              constituents = parsed_data.get(idx_name, [])
              valid_ytds = [item['ytd'] for item in constituents if item.get('ytd') is not None]
              if valid_ytds:
                  output["indexReturns"][idx_name] = round(sum(valid_ytds) / len(valid_ytds), 2)
              else:
                  output["indexReturns"][idx_name] = 0.0

          with open('data.json', 'w') as f:
              json.dump(output, f, indent=2)
          EOF

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@github.com"
          git add data.json
          git commit -m "Fetch complete NIFTY 500 constituents dynamically [skip ci]" || exit 0
          git push
