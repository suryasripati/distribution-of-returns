name: Update Stock Data Daily

on:
  schedule:
    - cron: '0 23 * * 1-5' # Runs Mon-Fri at 11:00 PM UTC
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install yfinance pandas requests lxml html5lib

      - name: Fetch Prices & Update JSON
        run: |
          python - << 'EOF'
          import datetime
          import json
          import pandas as pd
          import yfinance as yf
          import time
          import requests

          def fetch_ytd_in_batches(ticker_list, batch_size=30):
              data = []
              start_date = f"{datetime.date.today().year}-01-01"
              
              for i in range(0, len(ticker_list), batch_size):
                  batch = ticker_list[i:i + batch_size]
                  try:
                      df = yf.download(batch, start=start_date, progress=False)
                      closes = df['Close'] if 'Close' in df else df
                      
                      for t in batch:
                          try:
                              if len(batch) == 1:
                                  series = closes.dropna()
                              else:
                                  series = closes[t].dropna()
                                  
                              if len(series) > 0:
                                  start_price = float(series.iloc[0])
                                  current_price = float(series.iloc[-1])
                                  ytd = ((current_price - start_price) / start_price) * 100
                                  clean_ticker = t.replace('.NS', '')
                                  data.append({"ticker": clean_ticker, "ytd": round(ytd, 2)})
                          except Exception:
                              continue
                  except Exception as e:
                      print(f"Batch download error: {e}")
                  time.sleep(0.3)
              return data

          def get_nasdaq100():
              try:
                  url = "https://raw.githubusercontent.com/rreusser/financial-data/master/nasdaq100.json"
                  r = requests.get(url, timeout=10)
                  if r.status_code == 200:
                      return r.json()
              except Exception:
                  pass
              return ["AAPL","MSFT","NVDA","AMZN","META","GOOGL","GOOG","AVGO","TSLA","COST","AMD","TMUS","NFLX","PEP","CSCO","ADBE","AMAT","QCOM","TMUS","INTC","TXN","CMCSA","INTU","AMGN","ISRG","BKNG","HON","LRCX","MDLZ","VRTX","ADP","ADI","REGN","PANW","SBUX","SNPS","KLAC","CDNS","MU","PYPL","MELI","CSX","ORLY","MAR","ASML","CTAS","ROP","MNST","PCAR","AEP","ROST","KDP","PAYX","NXPI","CPRT","ODFL","FAST","AZN","DXCM","LULU","GEHC","MRVL","IDXX","VRSK","CTSH","CSGP","KHC","ON","EXC","EA","BKR","XEL","FANG","ANSS","CDW","DLTR","FANG","MCHP","BIIB","ILMN","WBD","WWD","TTWO","DXCM"]

          def get_sp500():
              try:
                  url = 'https://en.wikipedia.org/wiki/List_of_S%26P_500_companies'
                  headers = {'User-Agent': 'Mozilla/5.0'}
                  r = requests.get(url, headers=headers)
                  tables = pd.read_html(r.text)
                  df = tables[0]
                  return [t.replace('.', '-') for t in df['Symbol'].tolist()]
              except Exception:
                  return ["AAPL","MSFT","NVDA","AMZN","META","GOOGL","BRK-B","JPM","LLY","V","UNH","XOM","MA","HD","PG","COST","JNJ","ABBV","BAC","NKE","MRK","CVX","WMT","CRM","MCD"]

          # Indian Indices Lists (Full Exact Constituents)
          NIFTY_50 = ["ADANIENT","ADANIPORTS","APOLLOHOSP","ASIANPAINT","AXISBANK","BAJAJ-AUTO","BAJFINANCE","BAJAJFINSV","BEL","BPCL","BHARTIARTL","BRITANNIA","CIPLA","COALINDIA","DIVISLAB","DRREDDY","EICHERMOT","GRASIM","HCLTECH","HDFCBANK","HDFCLIFE","HEROMOTOCO","HINDALCO","HINDUNILVR","ICICIBANK","ITC","INDUSINDBK","INFY","JSWSTEEL","KOTAKBANK","LT","LTIM","MM","MARUTI","NTPC","NESTLEIND","ONGC","POWERGRID","RELIANCE","SBILIFE","SHRIRAMFIN","SBIN","SUNPHARMA","TCS","TATACONSUM","TATAMOTORS","TATASTEEL","TECHM","TITAN","ULTRACEMCO","WIPRO"]
          
          NIFTY_NEXT50 = ["ABB","AMBUJACEM","BANKBARODA","BERGEPAINT","BHARATFORG","BOSCHLTD","CANBK","CGPOWER","CHOLAFIN","COLPAL","DLF","DMART","GAIL","GODREJPROP","HAL","HAVELLS","ICICIGI","ICICIPRULI","IOC","IRCTC","IRFC","JINDALSTEL","JIOFIN","JSWENERGY","LICOFI","LODHA","MAXHEALTH","MOTHERSON","NAUKRI","NHPC","OIL","PAYTM","PFC","PNB","POLICYBZR","POONAWALLA","REC","RVNL","SIEMENS","SRF","SUPREMEIND","TATAPOWER","TRENT","TORNTPHARM","TVSMOTOR","UNITDSPR","VBL","VEDL","ZOMATO","ZYDUSLIFE","BAJAJ-AUTO","LTIM"]

          NIFTY_IT = ["TCS","INFY","HCLTECH","WIPRO","TECHM","LTIM","PERSISTENT","COFORGE","MPHASIS","LTTS"]

          NIFTY_BANK = ["HDFCBANK","ICICIBANK","SBIN","KOTAKBANK","AXISBANK","BANKBARODA","PNB","CANBK","FEDERALBNK","IDFCFIRSTB","AUBANK","INDUSINDBK"]

          NIFTY_FINSRV = ["AXISBANK","BAJAJ-AUTO","BAJFINANCE","BAJAJFINSV","CHOLAFIN","HDFCBANK","HDFCLIFE","ICICIBANK","ICICIGI","ICICIPRULI","IDFCFIRSTB","JIOFIN","KOTAKBANK","LICHSGFIN","LICOFI","MUTHOOTFIN","PFC","REC","SBICARD","SBILIFE","SBIN","SHRIRAMFIN"]

          NIFTY_MIDCAP100 = ["AURALABS","ASTRAL","AUROPHARMA","BALKRISIND","BANDHANBNK","COFORGE","CONCOR","DIXON","ESCORTS","FEDERALBNK","GLENMARK","GODREJPROP","IDFCFIRSTB","INDHOTEL","IPCALAB","LUPIN","MAXHEALTH","MRF","MUTHOOTFIN","OBEROIRLTY","OFSS","PERSISTENT","POLYCAB","SUZLON","TATAELXSI","VOLTAS","ABCAPITAL","ABFRL","ALKEM","AUBANK","BHARATFORG","BSOFT","BHEL","CANFINHOME","CGPOWER","CHAMBLFERT","COALINDIA","CROMPTON","CUMMINSIND","DEEPAKNTR","DELHIVERY","ESCORTS","EXIDEIND","GLAXO","GLENMARK","GODREJREPL","GUJGASLTD","IPCALAB","JUBLFOOD","KALYANKJIL","KEI","L&TFH","LAURUSLABS","LUPIN","MFSL","MGL","NATIONALUM","NAVINFLUOR","NMDC","OIL","PAYTM","PERSISTENT","PETRONET","POLYCAB","POONAWALLA","RBLBANK","SAIL","SJF","TATACOMM","TATAELXSI","TIINDIA","UNIONBANK","UPL","YESBANK"]

          NIFTY_500 = list(set(NIFTY_50 + NIFTY_NEXT50 + NIFTY_MIDCAP100))

          indices_config = {
              "NASDAQ100": get_nasdaq100(),
              "SP500": get_sp500(),
              "NIFTY50": [f"{t}.NS" for t in list(set(NIFTY_50))],
              "NIFTYNEXT50": [f"{t}.NS" for t in list(set(NIFTY_NEXT50))],
              "NIFTYIT": [f"{t}.NS" for t in list(set(NIFTY_IT))],
              "NIFTYBANK": [f"{t}.NS" for t in list(set(NIFTY_BANK))],
              "NIFTYFINSRV": [f"{t}.NS" for t in list(set(NIFTY_FINSRV))],
              "NIFTYMIDCAP100": [f"{t}.NS" for t in list(set(NIFTY_MIDCAP100))],
              "NIFTY500": [f"{t}.NS" for t in NIFTY_500]
          }

          output = {
              "lastUpdated": datetime.date.today().strftime("%b %d, %Y")
          }

          for name, tickers in indices_config.items():
              print(f"Downloading {len(tickers)} tickers for {name}...")
              output[name] = fetch_ytd_in_batches(tickers)

          with open('data.json', 'w') as f:
              json.dump(output, f, indent=2)
          EOF

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@github.com"
          git add data.json
          git commit -m "Fixed missing tickers and US indices fetching [skip ci]" || exit 0
          git push
