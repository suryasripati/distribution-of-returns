<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Distribution of Returns in Index</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --primary-blue: #2563eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 30px 20px;
    }

    .container { max-width: 1400px; margin: 0 auto; }
    header { margin-bottom: 24px; }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 6px; }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .badge-ytd {
      background-color: #ffe4e6;
      color: #e11d48;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
    }

    .controls-panel {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .control-row { display: flex; align-items: center; gap: 16px; }
    .control-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      width: 70px;
      flex-shrink: 0;
    }

    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover { background: #e2e8f0; }
    .btn.active {
      background: var(--primary-blue);
      color: #ffffff;
      border-color: var(--primary-blue);
    }

    .btn-export {
      background: #10b981;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-left: auto;
      transition: background 0.2s ease;
    }
    .btn-export:hover { background: #059669; }

    /* Search & Portfolio Section */
    .search-container {
      position: relative;
      flex-grow: 1;
      max-width: 480px;
    }

    .search-input {
      width: 100%;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary-blue);
    }

    .suggestions-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      max-height: 220px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      display: none;
      margin-top: 4px;
    }

    .suggestion-item {
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .suggestion-item:hover {
      background: var(--bg-color);
    }

    .suggestion-meta {
      font-size: 11px;
      color: var(--text-muted);
    }

    .portfolio-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .tag {
      background: #e0e7ff;
      color: #3730a3;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .tag.off-screen {
      background: #fef3c7;
      color: #92400e;
    }

    .tag-remove {
      cursor: pointer;
      font-weight: 700;
      color: #4338ca;
      margin-left: 2px;
    }
    .tag.off-screen .tag-remove {
      color: #b45309;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(10, minmax(110px, 1fr));
      gap: 12px;
      align-items: start;
    }

    .bucket-column { display: flex; flex-direction: column; gap: 8px; }
    .bucket-header {
      padding: 10px 6px;
      border-radius: 6px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
    }

    .tile {
      padding: 10px 4px;
      border-radius: 6px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      word-break: break-word;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      transition: all 0.2s ease;
    }

    /* Highlight & Dim styles for search matches */
    .tile.dimmed {
      opacity: 0.25;
    }

    .tile.highlighted {
      outline: 3px solid #f59e0b;
      transform: scale(1.08);
      z-index: 10;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
      opacity: 1 !important;
    }

    @media (max-width: 1200px) {
      .grid-container { grid-template-columns: repeat(5, 1fr); }
    }
    @media (max-width: 600px) {
      .grid-container { grid-template-columns: repeat(2, 1fr); }
      .control-row { flex-direction: column; align-items: flex-start; }
      .btn-export { margin-left: 0; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Distribution of Returns in Index</h1>
    <div class="header-meta">
      <span id="date-label">Individual companies' YTD Returns as on --</span>
      <span id="index-return-badge" class="badge-ytd">Index YTD Return: --</span>
    </div>
  </header>

  <div class="controls-panel">
    <div class="control-row">
      <span class="control-label">Country</span>
      <div class="btn-group" id="country-buttons">
        <button class="btn active" onclick="setCountry('US')">US</button>
        <button class="btn" onclick="setCountry('INDIA')">INDIA</button>
      </div>
    </div>
    <div class="control-row">
      <span class="control-label">Index</span>
      <div class="btn-group" id="index-buttons"></div>
    </div>
    
    <!-- Portfolio Search Row -->
    <div class="control-row">
      <span class="control-label">Spot Stocks</span>
      <div class="search-container">
        <input type="text" id="ticker-search" class="search-input" placeholder="Spot your stocks: Enter tickers to highlight where they land..." autocomplete="off" />
        <div id="suggestions" class="suggestions-dropdown"></div>
      </div>
      <button class="btn-export" onclick="exportPortfolioCSV()">Export Portfolio to CSV</button>
    </div>
    <div id="portfolio-tags-container" class="portfolio-tags"></div>
  </div>

  <div class="grid-container" id="buckets-grid"></div>
</div>

<script>
  let globalData = null;
  let currentCountry = 'US';
  let currentIndex = 'NASDAQ100';
  let selectedTickers = new Set();

  const INDICES = {
    US: [
      { id: 'NASDAQ100', name: 'NASDAQ 100' },
      { id: 'SP500', name: 'S&P 500' },
      { id: 'SP500_IT', name: 'S&P IT' },
      { id: 'SP500_FIN', name: 'S&P FINANCIALS' },
      { id: 'SP500_HEALTH', name: 'S&P HEALTHCARE' },
      { id: 'SP500_CONS_DISC', name: 'S&P CONS DISCR' },
      { id: 'SP500_ENERGY', name: 'S&P ENERGY' }
    ],
    INDIA: [
      { id: 'NIFTY50', name: 'NIFTY 50' },
      { id: 'NIFTYNEXT50', name: 'NIFTY NEXT 50' },
      { id: 'NIFTY500', name: 'NIFTY 500' },
      { id: 'NIFTYMIDCAP100', name: 'NIFTY MIDCAP 100' },
      { id: 'NIFTYIT', name: 'NIFTY IT' },
      { id: 'NIFTYBANK', name: 'NIFTY BANK' },
      { id: 'NIFTYFINSRV', name: 'NIFTY FINSRV' }
    ]
  };

  const BUCKETS = [
    { label: 'More than -40%', min: -Infinity, max: -40, color: '#680000', tileColor: '#800000' },
    { label: '-40% to -30%', min: -40, max: -30, color: '#8b1a1a', tileColor: '#a52a2a' },
    { label: '-30% to -20%', min: -30, max: -20, color: '#b23b3b', tileColor: '#cd5c5c' },
    { label: '-20% to -10%', min: -20, max: -10, color: '#d96b6b', tileColor: '#f08080' },
    { label: '-10% to 0%', min: -10, max: 0, color: '#f8a5a5', tileColor: '#ffc0cb' },
    { label: '0% to 10%', min: 0, max: 10, color: '#a3e635', tileColor: '#86efac' },
    { label: '10% to 20%', min: 10, max: 20, color: '#4ade80', tileColor: '#4ade80' },
    { label: '20% to 30%', min: 20, max: 30, color: '#22c55e', tileColor: '#22c55e' },
    { label: '30% to 40%', min: 30, max: 40, color: '#16a34a', tileColor: '#16a34a' },
    { label: 'More than 40%', min: 40, max: Infinity, color: '#14532d', tileColor: '#064e3b' }
  ];

  async function loadData() {
    try {
      const res = await fetch('data.json');
      globalData = await res.json();
      document.getElementById('date-label').innerText = `Individual companies' YTD Returns as on ${globalData.lastUpdated}`;
      renderIndexButtons();
      renderDashboard();
      setupSearch();
    } catch (e) {
      console.error('Error loading JSON data:', e);
    }
  }

  function setCountry(country) {
    currentCountry = country;
    currentIndex = INDICES[country][0].id;
    
    document.querySelectorAll('#country-buttons .btn').forEach(btn => {
      btn.classList.toggle('active', btn.innerText === country);
    });

    renderIndexButtons();
    renderDashboard();
  }

  function setIndex(indexId) {
    currentIndex = indexId;
    document.querySelectorAll('#index-buttons .btn').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-id') === indexId);
    });
    renderDashboard();
  }

  function switchIndexToTicker(ticker) {
    for (const countryKey in INDICES) {
      for (const idxObj of INDICES[countryKey]) {
        const list = globalData[idxObj.id] || [];
        if (list.some(item => item.ticker === ticker)) {
          currentCountry = countryKey;
          currentIndex = idxObj.id;
          
          document.querySelectorAll('#country-buttons .btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText === countryKey);
          });
          
          renderIndexButtons();
          renderDashboard();
          return;
        }
      }
    }
  }

  function renderIndexButtons() {
    const container = document.getElementById('index-buttons');
    container.innerHTML = '';
    INDICES[currentCountry].forEach(idx => {
      const btn = document.createElement('button');
      btn.className = `btn ${idx.id === currentIndex ? 'active' : ''}`;
      btn.setAttribute('data-id', idx.id);
      btn.innerText = idx.name;
      btn.onclick = () => setIndex(idx.id);
      container.appendChild(btn);
    });
  }

  function renderDashboard() {
    if (!globalData) return;

    const idxReturn = globalData.indexReturns ? globalData.indexReturns[currentIndex] : 0;
    const badge = document.getElementById('index-return-badge');
    badge.innerText = `Index YTD Return: ${idxReturn >= 0 ? '+' : ''}${idxReturn}%`;
    badge.style.backgroundColor = idxReturn >= 0 ? '#dcfce7' : '#ffe4e6';
    badge.style.color = idxReturn >= 0 ? '#15803d' : '#e11d48';

    const constituents = globalData[currentIndex] || [];
    const grid = document.getElementById('buckets-grid');
    grid.innerHTML = '';

    const activeIndexTickers = new Set(constituents.map(c => c.ticker));
    const hasSelectionInCurrentIndex = Array.from(selectedTickers).some(t => activeIndexTickers.has(t));

    BUCKETS.forEach(b => {
      const filtered = constituents.filter(item => {
        if (b.min === -Infinity) return item.ytd < b.max;
        if (b.max === Infinity) return item.ytd >= b.min;
        return item.ytd >= b.min && item.ytd < b.max;
      });

      filtered.sort((a, b) => b.ytd - a.ytd);

      const col = document.createElement('div');
      col.className = 'bucket-column';

      const header = document.createElement('div');
      header.className = 'bucket-header';
      header.style.backgroundColor = b.color;
      header.innerHTML = `${b.label}<br>(${filtered.length})`;
      col.appendChild(header);

      filtered.forEach(item => {
        const tile = document.createElement('div');
        const isMatched = selectedTickers.has(item.ticker);

        let tileClass = 'tile';
        if (hasSelectionInCurrentIndex) {
          tileClass += isMatched ? ' highlighted' : ' dimmed';
        }

        tile.className = tileClass;
        tile.style.backgroundColor = b.tileColor;
        tile.innerText = item.ticker;
        tile.title = `${item.ticker}: ${item.ytd}%`;
        col.appendChild(tile);
      });

      grid.appendChild(col);
    });

    renderTags();
  }

  function setupSearch() {
    const searchInput = document.getElementById('ticker-search');
    const dropdown = document.getElementById('suggestions');

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.trim().toUpperCase();
      if (!query) {
        dropdown.style.display = 'none';
        return;
      }

      // Collect tickers from ALL indices across globalData
      const allMatches = [];
      const seenTickers = new Set();

      for (const countryKey in INDICES) {
        INDICES[countryKey].forEach(idxObj => {
          const list = globalData[idxObj.id] || [];
          list.forEach(item => {
            if (item.ticker.includes(query) && !selectedTickers.has(item.ticker) && !seenTickers.has(item.ticker)) {
              seenTickers.add(item.ticker);
              allMatches.push({
                ticker: item.ticker,
                ytd: item.ytd,
                indexName: idxObj.name,
                indexId: idxObj.id
              });
            }
          });
        });
      }

      if (allMatches.length === 0) {
        dropdown.style.display = 'none';
        return;
      }

      dropdown.innerHTML = '';
      allMatches.slice(0, 10).forEach(item => {
        const div = document.createElement('div');
        div.className = 'suggestion-item';
        div.innerHTML = `<span><strong>${item.ticker}</strong> (${item.ytd}%)</span> <span class="suggestion-meta">${item.indexName}</span>`;
        div.onclick = () => {
          addTicker(item.ticker);
          searchInput.value = '';
          dropdown.style.display = 'none';
        };
        dropdown.appendChild(div);
      });
      dropdown.style.display = 'block';
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-container')) {
        dropdown.style.display = 'none';
      }
    });
  }

  function addTicker(ticker) {
    selectedTickers.add(ticker);
    renderDashboard();
  }

  function removeTicker(ticker) {
    selectedTickers.delete(ticker);
    renderDashboard();
  }

  function renderTags() {
    const container = document.getElementById('portfolio-tags-container');
    container.innerHTML = '';
    
    const activeConstituents = (globalData[currentIndex] || []).map(c => c.ticker);

    selectedTickers.forEach(ticker => {
      const isInCurrent = activeConstituents.includes(ticker);
      const tag = document.createElement('div');
      tag.className = `tag ${isInCurrent ? '' : 'off-screen'}`;
      tag.title = isInCurrent ? 'Click to highlight' : 'Belongs to another index. Click to view its index.';
      
      tag.innerHTML = `${ticker} ${isInCurrent ? '' : '↗'} <span class="tag-remove" onclick="event.stopPropagation(); removeTicker('${ticker}')">&times;</span>`;
      tag.onclick = () => switchIndexToTicker(ticker);
      
      container.appendChild(tag);
    });
  }

  function exportPortfolioCSV() {
    if (selectedTickers.size === 0) {
      alert('Please add at least one stock to export.');
      return;
    }

    let csvContent = "data:text/csv;charset=utf-8,Stock Ticker,Stock YTD Return (%),Benchmark Index,Benchmark YTD Return (%),Outperformance (%)\n";

    selectedTickers.forEach(ticker => {
      let foundItem = null;
      let benchmarkName = '';
      let benchmarkReturn = 0;

      for (const countryKey in INDICES) {
        for (const idxObj of INDICES[countryKey]) {
          const list = globalData[idxObj.id] || [];
          const match = list.find(i => i.ticker === ticker);
          if (match) {
            foundItem = match;
            benchmarkName = idxObj.name;
            benchmarkReturn = globalData.indexReturns ? (globalData.indexReturns[idxObj.id] || 0) : 0;
            break;
          }
        }
        if (foundItem) break;
      }

      if (foundItem) {
        const alpha = (foundItem.ytd - benchmarkReturn).toFixed(2);
        csvContent += `${ticker},${foundItem.ytd},${benchmarkName},${benchmarkReturn},${alpha}\n`;
      }
    });

    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", `portfolio_returns_export.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  loadData();
</script>
</body>
</html>
